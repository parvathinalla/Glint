<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1510" viewBox="0 0 1800 1510"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#67809e"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif"><rect width="1800" height="1510" fill="#f2f6fb"/><text x="60" y="67" font-size="40" fill="#1467ca" font-weight="800">GLINT</text><text x="225" y="67" font-size="38" fill="#132b49" font-weight="700">How the companion works</text><text x="60" y="108" font-size="21" fill="#31445d" font-weight="400">Current local implementation • Source review: 31 October 2026 • Tools are listed beside each job</text><rect x="60" y="145" width="500" height="47" rx="12" fill="#2367c8"/><text x="80" y="177" font-size="22" fill="white" font-weight="700">1  YOUR BROWSER</text><rect x="650" y="145" width="500" height="47" rx="12" fill="#087e80"/><text x="670" y="177" font-size="22" fill="white" font-weight="700">2  LOCAL APP SERVER</text><rect x="1240" y="145" width="500" height="47" rx="12" fill="#7e4ab9"/><text x="1260" y="177" font-size="22" fill="white" font-weight="700">3  EXTERNAL AI SERVICE</text><rect x="60" y="215" width="500" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="60" y="231" width="5" height="123" rx="2" fill="#2367c8"/><text x="82" y="249" font-size="24" fill="#132b49" font-weight="700">Companion screen</text><text x="82" y="279" font-size="19" fill="#2367c8" font-weight="600">React 19 + TypeScript + CSS / SVG</text><text x="82" y="311" font-size="19" fill="#31445d" font-weight="400">Chat, transcripts, front/back camera controls</text><text x="82" y="339" font-size="19" fill="#31445d" font-weight="400">Animated star intro; illustrated task example</text><rect x="60" y="390" width="500" height="215" rx="16" fill="white" stroke="#d6e1ee"/><rect x="60" y="406" width="5" height="183" rx="2" fill="#2367c8"/><text x="82" y="424" font-size="24" fill="#132b49" font-weight="700">See the task</text><text x="82" y="454" font-size="19" fill="#2367c8" font-weight="600">Browser camera + Canvas + Web Workers</text><text x="82" y="486" font-size="19" fill="#31445d" font-weight="400">Quality checks and bounded frame buffer</text><text x="82" y="514" font-size="19" fill="#31445d" font-weight="400">MediaPipe Pose Landmarker: local pose events</text><text x="82" y="542" font-size="19" fill="#31445d" font-weight="400">Up to 6 recent frames sent per observation</text><text x="82" y="570" font-size="19" fill="#31445d" font-weight="400">Idle observations about every 6 seconds</text><rect x="60" y="625" width="500" height="215" rx="16" fill="white" stroke="#d6e1ee"/><rect x="60" y="641" width="5" height="183" rx="2" fill="#2367c8"/><text x="82" y="659" font-size="24" fill="#132b49" font-weight="700">Hear the user</text><text x="82" y="689" font-size="19" fill="#2367c8" font-weight="600">Web Audio / AudioWorklet + ONNX WASM</text><text x="82" y="721" font-size="19" fill="#31445d" font-weight="400">Silero VAD + energy: detect speech turns</text><text x="82" y="749" font-size="19" fill="#31445d" font-weight="400">WeSpeaker: optional enrolled-speaker check</text><text x="82" y="777" font-size="19" fill="#31445d" font-weight="400">Echo guard and interruption handling</text><text x="82" y="805" font-size="19" fill="#31445d" font-weight="400">PCM streaming; bounded WAV fallback</text><rect x="60" y="860" width="500" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="60" y="876" width="5" height="123" rx="2" fill="#2367c8"/><text x="82" y="894" font-size="24" fill="#132b49" font-weight="700">Show and speak the reply</text><text x="82" y="924" font-size="19" fill="#2367c8" font-weight="600">Stream reader + Web Audio + Speech API</text><text x="82" y="956" font-size="19" fill="#31445d" font-weight="400">Incremental text, captions and PCM playback</text><text x="82" y="984" font-size="19" fill="#31445d" font-weight="400">Device speech if neural voice is unavailable</text><rect x="650" y="215" width="500" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="650" y="231" width="5" height="123" rx="2" fill="#087e80"/><text x="672" y="249" font-size="24" fill="#132b49" font-weight="700">Accept and validate requests</text><text x="672" y="279" font-size="19" fill="#087e80" font-weight="600">Node.js 24 + Express 5 + Helmet + Zod</text><text x="672" y="311" font-size="19" fill="#31445d" font-weight="400">Private cookie session and origin checks</text><text x="672" y="339" font-size="19" fill="#31445d" font-weight="400">HTTP API, status socket and voice socket</text><rect x="650" y="390" width="500" height="215" rx="16" fill="white" stroke="#d6e1ee"/><rect x="650" y="406" width="5" height="183" rx="2" fill="#087e80"/><text x="672" y="424" font-size="24" fill="#132b49" font-weight="700">Coordinate the conversation</text><text x="672" y="454" font-size="19" fill="#087e80" font-weight="600">Engine + shared TypeScript schemas</text><text x="672" y="486" font-size="19" fill="#31445d" font-weight="400">Chat history, visual context and task steps</text><text x="672" y="514" font-size="19" fill="#31445d" font-weight="400">Memory-only provider key with expiry</text><text x="672" y="542" font-size="19" fill="#31445d" font-weight="400">Cancellation, freshness and dispatch limits</text><text x="672" y="570" font-size="19" fill="#31445d" font-weight="400">Provider adapters select the right AI route</text><rect x="650" y="625" width="500" height="215" rx="16" fill="white" stroke="#d6e1ee"/><rect x="650" y="641" width="5" height="183" rx="2" fill="#087e80"/><text x="672" y="659" font-size="24" fill="#132b49" font-weight="700">Relay speech and synthesize replies</text><text x="672" y="689" font-size="19" fill="#087e80" font-weight="600">ws gateway + local sherpa-onnx-node</text><text x="672" y="721" font-size="19" fill="#31445d" font-weight="400">Forward microphone PCM to Meta ASR</text><text x="672" y="749" font-size="19" fill="#31445d" font-weight="400">Kokoro af_heart: local CPU voice</text><text x="672" y="777" font-size="19" fill="#31445d" font-weight="400">Device voice fallback; Telugu if available</text><text x="672" y="805" font-size="19" fill="#31445d" font-weight="400">Stream synthesized sentence PCM to browser</text><rect x="650" y="860" width="500" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="650" y="876" width="5" height="123" rx="2" fill="#087e80"/><text x="672" y="894" font-size="24" fill="#132b49" font-weight="700">Remember progress only if requested</text><text x="672" y="924" font-size="19" fill="#087e80" font-weight="600">SQLite via node:sqlite</text><text x="672" y="956" font-size="19" fill="#31445d" font-weight="400">.data/glint.sqlite • seven-day expiry</text><text x="672" y="984" font-size="19" fill="#31445d" font-weight="400">No API keys, conversation or image bytes</text><rect x="1240" y="215" width="500" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="1240" y="231" width="5" height="123" rx="2" fill="#7e4ab9"/><text x="1262" y="249" font-size="24" fill="#132b49" font-weight="700">Connect the selected model</text><text x="1262" y="279" font-size="19" fill="#7e4ab9" font-weight="600">Meta API • api.meta.ai/v1</text><text x="1262" y="311" font-size="19" fill="#31445d" font-weight="400">User supplies a session-only API key (BYOK)</text><text x="1262" y="339" font-size="19" fill="#31445d" font-weight="400">Model list: /models</text><rect x="1240" y="390" width="500" height="215" rx="16" fill="white" stroke="#d6e1ee"/><rect x="1240" y="406" width="5" height="183" rx="2" fill="#7e4ab9"/><text x="1262" y="424" font-size="24" fill="#132b49" font-weight="700">Understand, answer and research</text><text x="1262" y="454" font-size="19" fill="#7e4ab9" font-weight="600">Muse Spark • Responses API</text><text x="1262" y="486" font-size="19" fill="#31445d" font-weight="400">Text + ordered camera frames + context</text><text x="1262" y="514" font-size="19" fill="#31445d" font-weight="400">Streams answer text for conversation</text><text x="1262" y="542" font-size="19" fill="#31445d" font-weight="400">Built-in web_search for a supplied URL</text><text x="1262" y="570" font-size="19" fill="#31445d" font-weight="400">Checkpoint adapter: /chat/completions</text><rect x="1240" y="625" width="500" height="215" rx="16" fill="white" stroke="#d6e1ee"/><rect x="1240" y="641" width="5" height="183" rx="2" fill="#7e4ab9"/><text x="1262" y="659" font-size="24" fill="#132b49" font-weight="700">Convert speech into words</text><text x="1262" y="689" font-size="19" fill="#7e4ab9" font-weight="600">Muse Voice Transcribe</text><text x="1262" y="721" font-size="19" fill="#31445d" font-weight="400">Live ASR over /asr/realtime WebSocket</text><text x="1262" y="749" font-size="19" fill="#31445d" font-weight="400">Partial and final transcript events</text><text x="1262" y="777" font-size="19" fill="#31445d" font-weight="400">Bounded WAV transcription fallback</text><text x="1262" y="805" font-size="19" fill="#31445d" font-weight="400">Transcript feeds the conversation route</text><rect x="1240" y="860" width="500" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="1240" y="876" width="5" height="123" rx="2" fill="#7e4ab9"/><text x="1262" y="894" font-size="24" fill="#132b49" font-weight="700">What crosses this boundary</text><text x="1262" y="924" font-size="19" fill="#7e4ab9" font-weight="600">Provider calls use the connected user key</text><text x="1262" y="956" font-size="19" fill="#31445d" font-weight="400">Selected images, speech and text leave device</text><text x="1262" y="984" font-size="19" fill="#31445d" font-weight="400">Pose / VAD / speaker inference stay local</text><path d="M 565 475 L 640 475" stroke="#67809e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 1155 475 L 1230 475" stroke="#67809e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 565 720 L 640 720" stroke="#67809e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 1155 720 L 1230 720" stroke="#67809e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="578" y="455" font-size="16" fill="#31445d" font-weight="400">API</text><text x="1167" y="455" font-size="16" fill="#31445d" font-weight="400">HTTPS</text><text x="571" y="700" font-size="16" fill="#31445d" font-weight="400">socket</text><text x="1163" y="700" font-size="16" fill="#31445d" font-weight="400">socket</text><rect x="60" y="1045" width="1680" height="172" rx="18" fill="#e3edf9"/><text x="85" y="1081" font-size="23" fill="#132b49" font-weight="700">FOLLOW ONE VOICE TURN</text><text x="85" y="1120" font-size="22" fill="#31445d" font-weight="400">You speak → local speech detector → server → Meta transcription → transcript + recent camera frames → Muse Spark</text><text x="85" y="1156" font-size="22" fill="#31445d" font-weight="400">Muse reply → local Kokoro / device voice → streamed text + audio → browser captions and speaker</text><text x="85" y="1191" font-size="19" fill="#31445d" font-weight="400">Transport: HTTP JSON for controls • /voice-stream for microphone PCM • SSE response for reply text and audio • /events for status</text><rect x="60" y="1240" width="815" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="60" y="1256" width="5" height="123" rx="2" fill="#2367c8"/><text x="82" y="1274" font-size="24" fill="#132b49" font-weight="700">Build and verify</text><text x="82" y="1304" font-size="19" fill="#2367c8" font-weight="600">npm + Vite + tsx + TypeScript + ESLint</text><text x="82" y="1336" font-size="19" fill="#31445d" font-weight="400">Vitest: unit / integration • Playwright: browser tests</text><text x="82" y="1364" font-size="19" fill="#31445d" font-weight="400">axe-core: accessibility checks • fixtures simulate providers</text><rect x="895" y="1240" width="845" height="155" rx="16" fill="white" stroke="#d6e1ee"/><rect x="895" y="1256" width="5" height="123" rx="2" fill="#95602a"/><text x="917" y="1274" font-size="24" fill="#132b49" font-weight="700">Scope of this picture</text><text x="917" y="1304" font-size="19" fill="#95602a" font-weight="600">Implemented local prototype; live qualification remains pending</text><text x="917" y="1336" font-size="19" fill="#31445d" font-weight="400">Managed auth, PostgreSQL and cloud hosting are future work.</text><text x="917" y="1364" font-size="19" fill="#31445d" font-weight="400">No native speech-to-speech or continuous full-FPS cloud video.</text><text x="60" y="1443" font-size="20" fill="#31445d" font-weight="400">Drawing tools: SVG + Node.js; PNG rendered with Playwright / Chromium. Editable source is included.</text><text x="60" y="1478" font-size="19" fill="#31445d" font-weight="400">Code is the reference: older design documents and README contain proposed or outdated details.</text></g></svg>