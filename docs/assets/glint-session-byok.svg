<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1690" viewBox="0 0 1900 1690" role="img" aria-labelledby="title desc"><title id="title">Glint session and BYOK sequence</title><desc id="desc">Four participant lanes show authentication, memory-only key exchange, confirmed instructions, selected observation analysis, fresh feedback, interruption, and key reentry on process loss.</desc><defs>
<marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#285E47"/></marker>
<marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#3166A2"/></marker>
<marker id="key" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#A34454"/></marker>
</defs><rect width="100%" height="100%" fill="#F6F3EA"/>
<text x="45" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="38" fill="#202923" font-weight="700">Glint · session and BYOK lifecycle</text>
<text x="45" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#53635B" font-weight="400">Detailed path · selected evidence only · proposed behavior, not an implemented security claim</text>
<polyline points="50,145 110,145" fill="none" stroke="#285E47" stroke-width="3" stroke-linejoin="round"  marker-end="url(#data)"/>
<text x="125" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#202923" font-weight="400">Data / evidence</text>
<polyline points="400,145 460,145" fill="none" stroke="#3166A2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#control)"/>
<text x="475" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#202923" font-weight="400">Control / feedback</text>
<polyline points="790,145 850,145" fill="none" stroke="#A34454" stroke-width="3" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#key)"/>
<text x="865" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#202923" font-weight="400">Secret route</text>
<text x="1190" y="152" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#53635B" font-weight="600">P = proposed   G = capability gate   U = user-reported test</text>
<rect x="40" y="195" width="390" height="66" rx="18" fill="#E8EFEA" stroke="#B5C7BC" stroke-width="2" />
<text x="63" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202923" font-weight="700">BROWSER / USER</text>
<line x1="235" y1="275" x2="235" y2="1490" stroke="#BEC9C1" stroke-width="2" stroke-dasharray="6 9"/>
<rect x="525" y="195" width="390" height="66" rx="18" fill="#E8EFEA" stroke="#B5C7BC" stroke-width="2" />
<text x="548" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202923" font-weight="700">GATEWAY + WORKER</text>
<line x1="720" y1="275" x2="720" y2="1490" stroke="#BEC9C1" stroke-width="2" stroke-dasharray="6 9"/>
<rect x="990" y="195" width="390" height="66" rx="18" fill="#EEEDF3" stroke="#B5C7BC" stroke-width="2" />
<text x="1013" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202923" font-weight="700">MODEL PROVIDER</text>
<line x1="1185" y1="275" x2="1185" y2="1490" stroke="#BEC9C1" stroke-width="2" stroke-dasharray="6 9"/>
<rect x="1455" y="195" width="390" height="66" rx="18" fill="#E8EFEA" stroke="#B5C7BC" stroke-width="2" />
<text x="1478" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202923" font-weight="700">DURABLE STORES</text>
<line x1="1650" y1="275" x2="1650" y2="1490" stroke="#BEC9C1" stroke-width="2" stroke-dasharray="6 9"/>
<rect x="50" y="280" width="1800" height="94" rx="18" fill="#FFFFFF" stroke="#D5DDD7" stroke-width="2" />
<text x="70" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202923" font-weight="650">1  Authenticate, disclose billing and retention, select a supported provider/model</text>
<text x="70" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#53635B" font-weight="400">A provider key is not login. App hosting/search/storage/voice require their own funded allowance.</text>
<polyline points="235,400 720,400" fill="none" stroke="#A34454" stroke-width="3" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#key)"/>
<text x="270" y="383" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#A34454" font-weight="600">2  Masked input → dedicated HTTPS body → clear input</text>
<text x="747" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#A34454" font-weight="400">Raw key held only in owner-process memory; opaque owner/session reference returned.</text>
<polyline points="720,500 1185,500" fill="none" stroke="#A34454" stroke-width="3" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#key)"/>
<text x="745" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#A34454" font-weight="600">3  Minimal documented validation</text>
<text x="740" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#A34454" font-weight="400">Disclose possible charge first; sanitize errors; no arbitrary API destination.</text>
<polyline points="1185,575 720,575" fill="none" stroke="#3166A2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#control)"/>
<text x="745" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3166A2" font-weight="600">Access / capabilities / sanitized failure</text>
<polyline points="235,655 720,655" fill="none" stroke="#285E47" stroke-width="3" stroke-linejoin="round"  marker-end="url(#data)"/>
<text x="270" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285E47" font-weight="600">4  Task + confirmed exact manual/version</text>
<polyline points="720,700 1650,700" fill="none" stroke="#285E47" stroke-width="3" stroke-linejoin="round"  marker-end="url(#data)"/>
<text x="760" y="684" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285E47" font-weight="600">Persist source hash + graph revision + owner; never persist the key</text>
<polyline points="235,790 720,790" fill="none" stroke="#285E47" stroke-width="3" stroke-linejoin="round"  marker-end="url(#data)"/>
<text x="270" y="771" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285E47" font-weight="600">5  Start → selected frames / ordered pre-event evidence</text>
<text x="270" y="821" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#53635B" font-weight="400">Local capture + worker + bounded ring; stream epoch, sequence and capture times accompany evidence.</text>
<polyline points="720,880 1185,880" fill="none" stroke="#A34454" stroke-width="3" stroke-linejoin="round" stroke-dasharray="3 6" marker-end="url(#key)"/>
<text x="744" y="862" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#A34454" font-weight="600">6  Provider TLS call with key</text>
<text x="745" y="913" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#53635B" font-weight="400">Only selected evidence + bounded task context; reserve budget before dispatch.</text>
<polyline points="1185,968 720,968" fill="none" stroke="#3166A2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#control)"/>
<text x="745" y="951" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3166A2" font-weight="600">Facts / hypotheses + proposed decision</text>
<polyline points="720,1030 1650,1030" fill="none" stroke="#285E47" stroke-width="3" stroke-linejoin="round"  marker-end="url(#data)"/>
<text x="760" y="1012" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285E47" font-weight="600">7  Freshness + prerequisites pass → transactional state commit</text>
<polyline points="720,1095 235,1095" fill="none" stroke="#3166A2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#control)"/>
<text x="270" y="1079" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3166A2" font-weight="600">8  Short answer + evidence IDs + expiry</text>
<text x="270" y="1127" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#53635B" font-weight="400">Browser rechecks epoch / pause / expiry. Local barge-in stops audio before server response.</text>
<rect x="50" y="1169" width="1800" height="94" rx="18" fill="#FFFFFF" stroke="#D5DDD7" stroke-width="2" />
<text x="70" y="1201" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#202923" font-weight="650">9  Pause / stop / key-credit failure cancels new analysis and pending feedback</text>
<text x="70" y="1232" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#53635B" font-weight="400">Pause stops camera/mic/upload. Key lease may survive pause; explicit Disconnect key removes its mapping.</text>
<polyline points="235,1295 720,1295" fill="none" stroke="#3166A2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#control)"/>
<text x="270" y="1277" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3166A2" font-weight="600">10  Reconnect: new epoch + last acknowledged event</text>
<polyline points="1650,1360 720,1360" fill="none" stroke="#285E47" stroke-width="3" stroke-linejoin="round"  marker-end="url(#data)"/>
<text x="760" y="1342" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#285E47" font-weight="600">Restore task state; process loss or lease expiry requires key reentry</text>
<polyline points="720,1425 235,1425" fill="none" stroke="#3166A2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#control)"/>
<text x="270" y="1408" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#3166A2" font-weight="600">Current view + valid key required before fresh guidance</text>
<text x="50" y="1540" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#A34454" font-weight="650">Default: no key in URLs, browser storage, logs, analytics, durable jobs, database or media store.</text>
<text x="50" y="1580" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#53635B" font-weight="400">Proposed key lease: 15 min idle / 120 min absolute. Backend/host can process the key; perfect memory zeroization is not promised.</text>
<text x="50" y="1620" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#53635B" font-weight="400">Remember-key is excluded initially; a future opt-in requires managed KMS envelope encryption, scoped access, audit, expiry and deletion.</text></svg>
